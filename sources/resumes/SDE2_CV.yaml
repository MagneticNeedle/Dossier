cv:
  name: Vibhakar Solanki 
  email: mail@vibhakar.com
  website: https://vibhakar.dev 
  social_networks:
    - network: LinkedIn
      username: solankivibhakar
    - network: GitHub
      username: MagneticNeedle 
  sections:
    experience:
      - company: "VideoVerse"
        location: Remote
        position: "SDE 2"
        start_date: "2026-01"
        end_date: "present"
        highlights:
          - "Built SmartThumbnails from scratch — an AI-powered thumbnail selection service that processed **4,500+ clips in its first month with a 99.2% client acceptance rate**, effectively eliminating manual thumbnail curation from broadcast workflows."
          - "Engineered the service using **FastAPI, PySceneDetect** for scene segmentation, Laplacian sharpness scoring for frame quality filtering, and Google Gemini via DSPy for AI-driven final selection"
          - "Automated clip enrichment at scale via an event-driven pipeline, 
            making every clip searchable and tagged the moment it's ingested."
          - "Added multi-language, EPG metadata, and AI tagging support to the export pipeline, **processing 11,000+ clips monthly** and letting broadcast clients localize content without manual work."
          - "Automated conflict detection and metadata back-fill across sibling clips, reducing manual editorial effort and **SLA breaches by 25%**."
          - "Shipped an API that unified a broadcast client's scheduling data into a single queryable source, replacing fragmented manual imports"
          - "Migrated from **Datadog to OpenTelemetry**, giving the team vendor-neutral structured observability and faster production debugging."

      - company: "VideoVerse"
        location: Remote
        position: SDE 1
        start_date: "2024-11"
        end_date: "2026-01"
        highlights:
          - "Built an internal LLM evaluation pipeline using Langfuse and DSPy
            Evaluate, improving model output accuracy **from 68% to 92%**."
          - "Applied automated prompt optimization using DSPy's **MIPRO/COPRO**
            optimizers and **GEPA**, lifting task-level accuracy **from 30% to 87%**."
          - "Built a centralized **AI Gateway** handling auth, request tracking, and auto-retriggers across 5 backend AI services, processing **50,000+ clips and 300+ streams monthly**"
          - "Engineered an LLM-powered video clip ratings pipeline using DSPy, handling over **500k clips per month**"
          - "Established monitoring and alerting workflows using Langfuse and OTEL to enforce SLA compliance."
          - "Co-led migration of entire **AWS infrastructure to Terraform**, improving infrastructure-as-code practices."
      - company: "VideoVerse"
        location: Remote
        position: "Software Engineer Intern"
        start_date: "2024-06"
        end_date: "2024-11"
        highlights:
          - "Originally interned at **LetsDive.io** as a Django backend engineer, leading the codebase migration from **Python 3.9 to 3.11**; continued the role at VideoVerse **following its acquisition of LetsDive.io**."
          - "Designed and implemented an ETL pipeline with **sub-100ms latency** to
            optimise data processing."
          - "Improved an existing thumbnail service by migrating from **SQLite to PostgreSQL**, adding auto-retries, and enhancing face-embedding data collection for better selection accuracy"
    projects:
      - name: Battlefield Portal Library | [bfportal.gg](https://bfportal.gg/) | [https://gh.bfportal.gg](https://github.com/battlefield-portal-community/bfportal.gg/)
        start_date: "2022-01"
        end_date: "present" 
        highlights:
          - "Built a Django-based CMS serving **17,000+ users**, with a full frontend built on Jinja templates — currently migrating to **HTMX** for faster, dynamic interactions without a JavaScript framework."
          - "Containerised with Docker and automated deployments via GitHub
            Actions."
      - name: Gametools Network | [gametools.network](https://gametools.network/) | [github.com/community-network](https://github.com/community-network)
        start_date: "2022-05"
        end_date: "present"
        highlights:
          - "Developed and maintain an open-source Stats API serving **3 million
            players**, handling over **2 million daily requests** via Envoy proxy and
            Cloudflare caching."
    skills:
      - label: "AI / ML"
        details: "DSPy, MIPRO/COPRO, GEPA, Langfuse, Google Gemini, VertexAI, Prompt Engineering, LLM Evaluation & Optimization"
      - label: "Backend"
        details: "Python, Go, TypeScript, FastAPI, Django, PostgreSQL, MongoDB, Redis"
      - label: "Infrastructure"
        details: "AWS, Terraform, Docker, OpenTelemetry, Grafana, Nginx, GitHub Actions, Envoy"
    education:
      - institution: "MIET"
        location: Meerut, Uttar Pradesh
        area: "Computer Science Engineering, Minor in Data Science"
        degree: "B.Tech"
        start_date: "2020"
        end_date: "2024"

design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 0.5cm
    bottom_margin: 0.1cm
    left_margin: 0.15in
    right_margin: 0.15in
    show_footer: false
    show_top_note: true
  colors:
    body: "#000000"
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.7em
    alignment: justified
    date_and_location_column_alignment: right
    font_family: Helvetica 
    font_size:
      body: 9.8pt
      name: 20pt
      headline: 5pt
      connections: 10pt
      section_titles: 1.2em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: true 
  header:
    alignment: center
    space_below_name: 0.5cm
    space_below_connections: 0.3cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true 
      display_urls_instead_of_usernames: true
      separator: ┃
      space_between_connections: 0.3cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.5em
    space_between_text_based_entries: 0.3em
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: ◦
      nested_bullet: ◦
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.5em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**
        *DEGREE* *in* *AREA*
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    experience_entry:
      main_column: |-
        **POSITION**
        *COMPANY*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
locale:
  language: english

settings:
  current_date: today
  render_command:
    output_folder: ../../artifacts/resumes 
    design:
    locale:
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_RESUME.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_RESUME.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_RESUME.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_RESUME.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_RESUME.png
    dont_generate_markdown: true 
    dont_generate_html: true 
    dont_generate_typst: false 
    dont_generate_pdf: false
    dont_generate_png: false
  bold_keywords: []
  pdf_title: NAME - Resume
